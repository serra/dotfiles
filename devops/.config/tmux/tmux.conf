# Use C-a as the prefix key instead of C-b.
# This is ergonomically more convennient for me.
# (Consider: map caps lock key to control)
set -g prefix C-a
unbind C-b
# Make sure we can send C-a to other apps by pressing it twice.
bind C-a send-prefix

# Set the base index for windows to 1 instead of 0.
# This way, the keys on the keyboard map 1:1 to the windows in the status bar.
set -g base-index 1

# For consistency, we do the same for panes.
set -w -g pane-base-index 1

# Reload my source file with prefix + r.
bind r source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"

# Split panes like in nvim, using | and -.
bind | split-window -h
bind - split-window -v

# Move between panes using hjkl.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes using HJKL.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Set mouse support on, although I know it could slow me down ...
# I want to be able to click on panes and windows, and scroll in them.
set -g mouse on

# Truecolour so the Catppuccin palette renders exactly in nvim and the status bar.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Pane settings: use arrow to point to the active pane.
set -g pane-border-indicators arrows

# Enable vi keys
set -g mode-keys vi
# remap copy paste keys to vim style
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection-and-cancel
unbind p
bind p paste-buffer

set -sg escape-time 10

# ── Catppuccin status bar (per-environment), plugin: catppuccin/tmux ─────────
# One Catppuccin theme family, a different flavour + badge per machine, so a
# glance tells you where you are. Base values = the production look: Macchiato
# flavour + a red "you are on prod" badge. The mac/devcontainer overlays re-set
# these knobs in local.conf (sourced just below, BEFORE the plugin runs, so its
# @catppuccin_flavor / @env_* overrides take effect). Prod (linux, no overlay)
# keeps these defaults.
#
# The plugin is installed (manual method, pinned) by the setup hooks into
# ~/.config/tmux/plugins/catppuccin/tmux. The run is guarded on its presence, so
# devops still works (plain tmux bar) on a box where setup hasn't run yet.
set -g @catppuccin_flavor "macchiato"
set -g @env_label "PROD"
set -g @env_accent "#ed8796"           # macchiato red
set -g @catppuccin_window_status_style "rounded"

# Per-machine overlay (clipboard bind, status-bar flavour/badge), supplied by the
# mac/devcontainer stow package. Sourced BEFORE the plugin runs so its overrides
# land. -q makes "no overlay present" a silent no-op, so devops stands alone.
source-file -q ~/.config/tmux/local.conf

# Load the plugin and assemble the status line — only if it's installed. The
# status line is built AFTER the run so the plugin's @thm_* palette is available:
# a coloured env badge + session on the left, host + clock on the right.
if-shell "[ -e ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux ]" {
  run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
  set -g status-left-length 100
  set -g status-right-length 100
  set -g status-left "#[bg=#{@env_accent},fg=#{E:@thm_crust},bold] #{@env_label} #[bg=#{E:@thm_bg},fg=#{@env_accent},bold] #S #[default] "
  set -g status-right "#{E:@catppuccin_status_host}"
  set -agF status-right "#{E:@catppuccin_status_date_time}"
}

