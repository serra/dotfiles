# macOS overlay (stow package: mac)
# Copy the tmux buffer to the system clipboard with prefix + C-c.
bind C-c run "tmux save-buffer - | pbcopy"

# Catppuccin Mocha + blue badge (overrides the devops Macchiato/red defaults).
# Sourced before the plugin runs (see tmux.conf), so these knobs take effect.
set -g @catppuccin_flavor "mocha"
set -g @env_label "mac"
set -g @env_accent "#89b4fa"           # mocha blue
