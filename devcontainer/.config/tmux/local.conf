# Devcontainer overlay (stow package: devcontainer)
# Copy the tmux buffer to the system clipboard via xclip when present;
# otherwise this bind is simply absent (headless container, no clipboard).
if-shell "command -v xclip" \
  'bind C-c run "tmux save-buffer - | xclip -selection clipboard"'

# Keep the status bar at the bottom (devops puts it on top); the container
# location reads differently at a glance from the host machines.
set -g status-position bottom

# Catppuccin Frappé + green badge (overrides the devops Macchiato/red defaults).
# Sourced before the plugin runs (see tmux.conf), so these knobs take effect.
set -g @catppuccin_flavor "frappe"
set -g @env_label "devcontainer"
set -g @env_accent "#a6d189"           # frappe green
